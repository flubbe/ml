name: CMake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux (x86_64 GCC 14)"
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            compiler_family: gcc
            build_type: Release

          - name: "macOS (Apple Silicon AArch64 Clang)"
            os: macos-latest
            cc: clang
            cxx: clang++
            compiler_family: clang
            build_type: Release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install GCC 14 (Linux)
        if: matrix.compiler_family == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          gcc-14 --version
          g++-14 --version

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y libboost-dev libboost-test-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install boost

      - name: Verify compiler and architecture
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version

      - name: Verify Apple Silicon
        if: matrix.compiler_family == 'clang'
        run: |
          test "$(uname -m)" = "arm64"

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          cmake --build build \
            --config ${{ matrix.build_type }} \
            --parallel

      - name: Run tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            -C ${{ matrix.build_type }}
