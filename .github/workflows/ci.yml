name: CMake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux (x86_64 GCC 14)"
            os: ubuntu-latest
            compiler_family: gcc
            build_type: Release

          - name: "macOS (Apple Silicon AArch64 Clang)"
            os: macos-latest
            compiler_family: clang
            build_type: Release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup GCC 14 (Linux)
        if: matrix.compiler_family == 'gcc'
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          gcc --version
          g++ --version

      - name: Verify Apple Clang & Architecture (macOS)
        if: matrix.compiler_family == 'clang'
        run: |
          clang++ --version
          uname -m

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Run tests
        run: |
          ctest --test-dir ${{ github.workspace }}/build --output-on-failure -C ${{ env.BUILD_TYPE }}
